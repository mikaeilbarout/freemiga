# HTTP: serve the Certbot ACME challenge, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name freemiga.com www.freemiga.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS, reverse-proxy everything to the app container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name freemiga.com www.freemiga.com;

    ssl_certificate     /etc/letsencrypt/live/freemiga.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freemiga.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10m;  # allow banner image uploads through the admin panel

    location / {
        proxy_pass http://app:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
