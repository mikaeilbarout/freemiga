<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('plans_page_title') }} | {{ site_name }}</title>
{% include "_fonts.html" %}
</head>
<body>

{% include "_nav.html" %}

<header class="page-hero">
  <h1 class="fade-up">{{ t('plans_hero_h1') }}</h1>
  <p class="lead fade-up" style="animation-delay:.08s">{{ t('plans_hero_p') }}</p>
</header>

<section class="section">
  <div class="plans-grid" id="plansGrid">
    <div class="plans-empty">{{ t('plans_loading') }}</div>
  </div>
  <div class="plans-pagination" id="plansPagination" style="display:none">
    <button class="plans-pagination-btn" id="plansPrevBtn" onclick="changePlansPage(-1)" aria-label="{{ t('plans_prev') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M{{ '9 6l6 6-6 6' if dir == 'rtl' else '15 6l-6 6 6 6' }}"/></svg>
    </button>
    <span class="plans-page-indicator" id="plansPageIndicator"></span>
    <button class="plans-pagination-btn" id="plansNextBtn" onclick="changePlansPage(1)" aria-label="{{ t('plans_next') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M{{ '15 6l-6 6 6 6' if dir == 'rtl' else '9 6l6 6-6 6' }}"/></svg>
    </button>
  </div>
</section>

<section class="section">
  <div class="card cta-band">
    <div>
      <h2>{{ t('plans_not_sure_h') }}</h2>
      <p>{{ t('plans_not_sure_p') }}</p>
    </div>
    <a class="btn btn-primary" href="/signup">{{ t('cta_band_btn') }}</a>
  </div>
</section>

{% include "_footer.html" %}

<script>
const PLANS_I18N = {
  dataAllowance: {{ t('plan_data_allowance', gb='__GB__')|tojson }},
  validity: {{ t('plan_validity', days='__DAYS__')|tojson }},
  fullAccess: {{ t('plan_full_access')|tojson }},
  deviceLimit: {{ t('plan_device_limit', n='__N__')|tojson }},
  bestValue: {{ t('plan_best_value')|tojson }},
  freeTrialTag: {{ t('free_trial_tag')|tojson }},
  billedOnce: {{ t('plan_billed_once')|tojson }},
  freeBilling: {{ t('plan_free_billing')|tojson }},
  choose: {{ t('plan_choose', name='__NAME__')|tojson }},
  claimFree: {{ t('claim_free_plan')|tojson }},
  priceFree: {{ t('price_free')|tojson }},
  empty: {{ t('plans_empty')|tojson }},
  loadError: {{ t('plans_load_error')|tojson }},
  pageOf: {{ t('plans_page_of', current='__CUR__', total='__TOT__')|tojson }},
};

const PLANS_PAGE_SIZE = 6;
let allPlans = [];
let currentPlansPage = 0;
let isLoggedIn = false;

function planFeatures(p) {
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>';
  return `
    <li>${check} ${PLANS_I18N.dataAllowance.replace('__GB__', p.data_limit_gb)}</li>
    <li>${check} ${PLANS_I18N.validity.replace('__DAYS__', p.duration_days)}</li>
    <li>${check} ${PLANS_I18N.fullAccess}</li>
    ${p.max_devices ? `<li>${check} ${PLANS_I18N.deviceLimit.replace('__N__', p.max_devices)}</li>` : ''}
  `;
}

function renderPlansPage() {
  const grid = document.getElementById('plansGrid');
  const paidPlans = allPlans.filter(p => p.price_usdt > 0);
  const featuredId = paidPlans.length
    ? paidPlans.reduce((a, b) => (b.price_usdt > a.price_usdt ? b : a), paidPlans[0]).id
    : null;

  const totalPages = Math.max(1, Math.ceil(allPlans.length / PLANS_PAGE_SIZE));
  currentPlansPage = Math.min(currentPlansPage, totalPages - 1);
  const start = currentPlansPage * PLANS_PAGE_SIZE;
  const pagePlans = allPlans.slice(start, start + PLANS_PAGE_SIZE);

  grid.innerHTML = pagePlans.map(p => {
    const isFree = p.price_usdt === 0;
    const isFeatured = p.id === featuredId;
    return `
    <div class="card plan-card ${isFeatured ? 'featured' : ''} ${isFree ? 'free-trial' : ''}">
      ${isFeatured ? `<div class="tag-featured">${PLANS_I18N.bestValue}</div>` : ''}
      ${isFree ? `<div class="tag-free">${PLANS_I18N.freeTrialTag}</div>` : ''}
      <div class="plan-name">${p.name}</div>
      <div class="plan-price">${isFree ? PLANS_I18N.priceFree : '$' + p.price_usdt}<span> / ${p.duration_days} days</span></div>
      <div class="plan-meta">${isFree ? PLANS_I18N.freeBilling : PLANS_I18N.billedOnce}</div>
      <ul class="plan-features">${planFeatures(p)}</ul>
      <a class="btn ${isFeatured ? 'btn-primary' : 'btn-ghost'} btn-block" href="${isLoggedIn ? '/billing' : '/signup'}?plan=${p.id}">${isFree ? PLANS_I18N.claimFree : PLANS_I18N.choose.replace('__NAME__', p.name)}</a>
    </div>
  `;
  }).join('');

  const pagination = document.getElementById('plansPagination');
  if (allPlans.length <= PLANS_PAGE_SIZE) {
    pagination.style.display = 'none';
  } else {
    pagination.style.display = 'flex';
    document.getElementById('plansPrevBtn').disabled = currentPlansPage === 0;
    document.getElementById('plansNextBtn').disabled = currentPlansPage >= totalPages - 1;
    document.getElementById('plansPageIndicator').textContent =
      PLANS_I18N.pageOf.replace('__CUR__', currentPlansPage + 1).replace('__TOT__', totalPages);
  }
}

function changePlansPage(delta) {
  currentPlansPage += delta;
  renderPlansPage();
  document.getElementById('plansGrid').scrollIntoView({behavior: 'smooth', block: 'start'});
}

async function loadPlans() {
  const grid = document.getElementById('plansGrid');
  try {
    const res = await fetch('/api/plans');
    const plans = await res.json();
    if (!plans.length) {
      grid.innerHTML = `<div class="plans-empty">${PLANS_I18N.empty}</div>`;
      return;
    }
    allPlans = plans;
    currentPlansPage = 0;
    renderPlansPage();
  } catch (e) {
    grid.innerHTML = `<div class="plans-empty">${PLANS_I18N.loadError}</div>`;
  }
}

async function checkLoggedIn() {
  const res = await fetch('/api/auth/me');
  isLoggedIn = res.ok;
}

checkLoggedIn().then(loadPlans);
</script>
</body>
</html>
