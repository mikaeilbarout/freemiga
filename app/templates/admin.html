<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | {{ site_name }}</title>
{% include "_fonts.html" %}
<style>
  .page-wrap { padding: 40px 16px 100px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 360px; padding: 32px; }
  .login-brand { text-align: center; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .login-card h2 { font-size: 16px; margin: 4px 0 22px; text-align: center; color: var(--text-dim); font-weight: 500; }

  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 2px; }
  .tab { padding: 9px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--text-dim); white-space: nowrap; }
  .tab.active { background: var(--gradient); color: #05060a; border-color: transparent; }

  .row-card { padding: 15px 18px; margin-bottom: 10px; font-size: 13px; }
  .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 10px; }
  .name { font-weight: 600; font-size: 14px; }
  .row-meta { color: var(--text-dim); font-size: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .field-err { color: var(--danger); font-size: 12.5px; margin-top: 8px; }

  .msg { font-size: 12.5px; padding: 9px 11px; border-radius: 8px; margin-bottom: 6px; line-height: 1.6; }
  .msg.customer { background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
  .msg.admin { background: var(--accent-soft); border: 1px solid rgba(124,92,255,0.3); }

  .new-plan-card input { margin-bottom: 10px; }
  .empty-state { color: var(--text-faint); font-size: 13px; padding: 16px; }

  .list-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .list-toolbar input, .list-toolbar select { margin-bottom: 0; width: auto; min-width: 200px; }
  .list-count { color: var(--text-faint); font-size: 12.5px; margin-inline-start: auto; white-space: nowrap; }

  .list-container { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); backdrop-filter: blur(20px); overflow: hidden; }
  .list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .list-row:last-child { border-bottom: none; }
  .lr-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lr-title { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lr-sub { color: var(--text-dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .lr-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .load-more-row { text-align: center; padding: 14px; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div class="login-wrap" id="loginCard">
  <div class="card login-card fade-up">
    <div class="login-brand"><span class="brand-name" style="background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent">{{ site_name }}</span></div>
    <h2>Admin sign in</h2>
    <label for="adminUser">Username</label>
    <input id="adminUser">
    <label for="adminPass">Password</label>
    <input id="adminPass" type="password">
    <button class="btn btn-primary btn-block" onclick="adminLogin()">Log in</button>
    <div class="field-err" id="loginErr"></div>
  </div>
</div>

<div class="page-wrap" id="panel" style="display:none">
  <div class="container">
    <div class="admin-header">
      <span class="brand"><span class="brand-mark">F</span><span class="brand-name">{{ site_name }}</span><span class="muted" style="font-size:13px;margin-left:6px">Admin</span></span>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="customers">Customers</div>
      <div class="tab" data-tab="orders">Orders</div>
      <div class="tab" data-tab="tickets">Support</div>
      <div class="tab" data-tab="plans">Plans</div>
      <div class="tab" data-tab="banners">Banners</div>
      <div class="tab" data-tab="auditlog">Activity log</div>
    </div>
    <div id="customers">
      <div class="list-toolbar">
        <input type="text" id="customerSearch" placeholder="Search username or email…">
        <span class="list-count" id="customerCount"></span>
      </div>
      <div class="list-container" id="customerRows"></div>
      <div class="load-more-row" id="customerLoadMoreRow" style="display:none">
        <button class="btn btn-ghost btn-sm" onclick="loadMoreCustomers()">Load more</button>
      </div>
    </div>

    <div id="orders" style="display:none">
      <div class="list-toolbar">
        <select id="orderStatusFilter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="provisioned">Active</option>
          <option value="expired">Expired</option>
          <option value="failed">Failed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <span class="list-count" id="orderCount"></span>
      </div>
      <div class="list-container" id="orderRows"></div>
      <div class="load-more-row" id="orderLoadMoreRow" style="display:none">
        <button class="btn btn-ghost btn-sm" onclick="loadMoreOrders()">Load more</button>
      </div>
    </div>

    <div id="tickets" style="display:none">
      <div class="list-toolbar">
        <input type="text" id="ticketSearch" placeholder="Search username or subject…">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);margin:0">
          <input type="checkbox" id="ticketOpenOnly" style="width:auto;margin:0" onchange="loadTickets()"> Open only
        </label>
        <span class="list-count" id="ticketCount"></span>
      </div>
      <div id="ticketCards"></div>
      <div class="load-more-row" id="ticketLoadMoreRow" style="display:none">
        <button class="btn btn-ghost btn-sm" onclick="loadMoreTickets()">Load more</button>
      </div>
    </div>

    <div id="plans" style="display:none"></div>
    <div id="banners" style="display:none"></div>

    <div id="auditlog" style="display:none">
      <div class="list-toolbar">
        <span class="list-count" id="auditCount"></span>
      </div>
      <div class="list-container" id="auditRows"></div>
      <div class="load-more-row" id="auditLoadMoreRow" style="display:none">
        <button class="btn btn-ghost btn-sm" onclick="loadMoreAuditLog()">Load more</button>
      </div>
    </div>
  </div>
</div>

{% include "_footer.html" %}

<script>
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  ['customers','orders','tickets','plans','banners','auditlog'].forEach(id => {
    document.getElementById(id).style.display = id === t.dataset.tab ? 'block' : 'none';
  });
}));

async function adminLogin() {
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: document.getElementById('adminUser').value,
      password: document.getElementById('adminPass').value
    })
  });
  if (!res.ok) {
    document.getElementById('loginErr').textContent = 'Login failed';
    return;
  }
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadCustomers(); loadOrders(); loadTickets(); loadAuditLog(); loadPlans(); loadBanners();
}

const PAGE_SIZE = 25;
let customerPage = 1, customerSearchTimer = null;
let orderPage = 1;
let ticketPage = 1;
let auditPage = 1;

function customerRowHtml(c) {
  return `
    <div class="list-row">
      <div class="lr-main">
        <div class="lr-title">${c.username}</div>
        <div class="lr-sub">${c.email ? c.email + (c.email_verified ? ' ✅' : ' (unverified)') : 'No email on file'} · ${c.contact || '—'} · ${new Date(c.created_at).toLocaleDateString('en-US')}${c.is_banned && !c.is_deleted ? ' · Reason: ' + c.ban_reason : ''}</div>
      </div>
      <div class="lr-right">
        <span class="badge ${c.is_deleted ? 'badge-neutral' : c.is_banned ? 'badge-danger' : 'badge-success'}">${c.is_deleted ? 'Deleted' : c.is_banned ? 'Suspended' : 'Active'}</span>
        ${c.is_deleted ? '' : `
          <div class="lr-actions">
            ${c.is_banned
              ? `<button class="btn btn-ghost btn-sm" onclick="unban('${c.id}')">Lift</button>`
              : `<button class="btn btn-danger btn-sm" onclick="banPrompt('${c.id}')">Suspend</button>`}
          </div>
        `}
      </div>
    </div>
  `;
}

async function loadCustomers(reset = true) {
  if (reset) { customerPage = 1; }
  const search = document.getElementById('customerSearch').value.trim();
  const params = new URLSearchParams({page: customerPage, page_size: PAGE_SIZE, search});
  const res = await fetch(`/api/admin/customers?${params}`);
  if (!res.ok) return;
  const data = await res.json();
  const container = document.getElementById('customerRows');
  const html = data.items.map(customerRowHtml).join('');
  if (reset) {
    container.innerHTML = html || '<div class="empty-state">No customers found</div>';
  } else {
    container.insertAdjacentHTML('beforeend', html);
  }
  document.getElementById('customerCount').textContent = `${data.total} total`;
  document.getElementById('customerLoadMoreRow').style.display = customerPage * PAGE_SIZE < data.total ? 'block' : 'none';
}

function loadMoreCustomers() { customerPage++; loadCustomers(false); }

document.getElementById('customerSearch').addEventListener('input', () => {
  clearTimeout(customerSearchTimer);
  customerSearchTimer = setTimeout(() => loadCustomers(true), 350);
});

async function banPrompt(id) {
  const reason = prompt('Enter a reason for suspension:');
  if (!reason) return;
  await fetch(`/api/admin/customers/${id}/ban`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reason})
  });
  loadCustomers(true);
}

async function unban(id) {
  await fetch(`/api/admin/customers/${id}/unban`, {method: 'POST'});
  loadCustomers(true);
}

function statusLabel(s) {
  return {pending: 'Pending', paid: 'Paid', provisioned: 'Active', expired: 'Expired', failed: 'Failed', cancelled: 'Cancelled'}[s] || s;
}

function orderRowHtml(o) {
  return `
    <div class="list-row">
      <div class="lr-main">
        <div class="lr-title">$${o.amount_due} ${o.is_renewal ? '(renewal)' : '(new)'}</div>
        <div class="lr-sub">${o.payment_method === 'card' ? 'Card (Stripe)' : o.payment_method === 'crypto' ? `Crypto (USDT-${o.crypto_network === 'polygon' ? 'Polygon' : 'TRC20'})` : 'Free'} · ${new Date(o.created_at).toLocaleString('en-US')}</div>
      </div>
      <div class="lr-right">
        <span class="badge ${o.status === 'provisioned' ? 'badge-success' : o.status === 'pending' ? 'badge-warning' : o.status === 'cancelled' ? 'badge-neutral' : 'badge-danger'}">${statusLabel(o.status)}</span>
        ${(o.status === 'pending' || o.status === 'failed') && o.payment_method === 'crypto'
          ? `<div class="lr-actions"><button class="btn btn-ghost btn-sm" onclick="confirmOrder('${o.id}')">Confirm manually</button></div>`
          : ''}
      </div>
    </div>
  `;
}

async function loadOrders(reset = true) {
  if (reset) { orderPage = 1; }
  const status = document.getElementById('orderStatusFilter').value;
  const params = new URLSearchParams({page: orderPage, page_size: PAGE_SIZE, status});
  const res = await fetch(`/api/admin/orders?${params}`);
  if (!res.ok) return;
  const data = await res.json();
  const container = document.getElementById('orderRows');
  const html = data.items.map(orderRowHtml).join('');
  if (reset) {
    container.innerHTML = html || '<div class="empty-state">No orders found</div>';
  } else {
    container.insertAdjacentHTML('beforeend', html);
  }
  document.getElementById('orderCount').textContent = `${data.total} total`;
  document.getElementById('orderLoadMoreRow').style.display = orderPage * PAGE_SIZE < data.total ? 'block' : 'none';
}

function loadMoreOrders() { orderPage++; loadOrders(false); }
document.getElementById('orderStatusFilter').addEventListener('change', () => loadOrders(true));

async function confirmOrder(id) {
  if (!confirm('Confirm this order manually? Only do this after verifying the payment yourself on-chain.')) return;
  const res = await fetch(`/api/admin/orders/${id}/confirm`, {method: 'POST'});
  if (!res.ok) { showToast('This order could not be confirmed — please try again.', 'error'); return; }
  loadOrders(true);
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

function ticketCardHtml(t) {
  const contactLine = t.customer_id
    ? ''
    : `<div class="row-meta" style="margin-top:4px">Guest contact: ${escapeHtml(t.guest_contact || '—')}</div>`;
  const identityLine = t.registered_email
    ? `<div class="row-meta" style="margin-top:2px${t.identity_mismatch ? ';color:var(--danger)' : ''}">
         Registered account email: ${escapeHtml(t.registered_email)}${t.identity_mismatch ? ' — does not match the contact above, verify identity before acting on this ticket' : ''}
       </div>`
    : '';
  return `
    <div class="card row-card"${t.needs_reply ? ' style="border-color:rgba(251,191,36,0.4)"' : ''}>
      <div class="row-top">
        <div class="name">${escapeHtml(t.customer_username)} — ${escapeHtml(t.subject)}</div>
        <div style="display:flex;gap:6px;align-items:center">
          ${t.needs_reply ? '<span class="badge badge-warning">Needs reply</span>' : ''}
          <span class="badge ${t.status === 'open' ? 'badge-warning' : 'badge-neutral'}">${t.status === 'open' ? 'Open' : 'Closed'}</span>
        </div>
      </div>
      ${contactLine}
      ${identityLine}
      ${t.messages.map(m => `
        <div class="msg ${m.sender}">
          ${escapeHtml(m.body)}
          ${m.attachment_path ? `<a href="${m.attachment_path}" target="_blank" rel="noopener"><img src="${m.attachment_path}" style="max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:8px;border:1px solid var(--border)" alt=""></a>` : ''}
        </div>
      `).join('')}
      <textarea id="reply-${t.id}" rows="2" placeholder="Write a reply..." style="margin-top:10px"></textarea>
      <input id="replyFile-${t.id}" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="margin-top:8px">
      <div class="actions">
        <button class="btn btn-primary btn-sm" onclick="replyTicket('${t.id}')">Send reply</button>
        ${t.status === 'open' ? `<button class="btn btn-ghost btn-sm" onclick="closeTicket('${t.id}')">Close ticket</button>` : ''}
      </div>
    </div>
  `;
}

let ticketSearchTimer = null;

async function loadTickets(reset = true) {
  if (reset) { ticketPage = 1; }
  const openOnly = document.getElementById('ticketOpenOnly').checked;
  const q = document.getElementById('ticketSearch').value.trim();
  const params = new URLSearchParams({page: ticketPage, page_size: PAGE_SIZE, open_only: openOnly});
  if (q) params.set('q', q);
  const res = await fetch(`/api/admin/tickets?${params}`);
  if (!res.ok) return;
  const data = await res.json();
  const container = document.getElementById('ticketCards');
  const html = data.items.map(ticketCardHtml).join('');
  if (reset) {
    container.innerHTML = html || '<div class="empty-state">No tickets found</div>';
  } else {
    container.insertAdjacentHTML('beforeend', html);
  }
  document.getElementById('ticketCount').textContent = `${data.total} total`;
  document.getElementById('ticketLoadMoreRow').style.display = ticketPage * PAGE_SIZE < data.total ? 'block' : 'none';
}

document.getElementById('ticketSearch').addEventListener('input', () => {
  clearTimeout(ticketSearchTimer);
  ticketSearchTimer = setTimeout(() => loadTickets(true), 350);
});

function loadMoreTickets() { ticketPage++; loadTickets(false); }

async function replyTicket(id) {
  const message = document.getElementById(`reply-${id}`).value.trim();
  if (!message) return;
  const form = new FormData();
  form.set('message', message);
  const file = document.getElementById(`replyFile-${id}`).files[0];
  if (file) form.set('attachment', file);
  await fetch(`/api/admin/tickets/${id}/reply`, { method: 'POST', body: form });
  loadTickets(true);
}

async function closeTicket(id) {
  await fetch(`/api/admin/tickets/${id}/close`, {method: 'POST'});
  loadTickets(true);
}

const actionLabels = {
  ban: 'Suspended account', unban: 'Lifted suspension',
  manual_confirm_order: 'Manually confirmed payment', reply_ticket: 'Replied to ticket',
  close_ticket: 'Closed ticket', create_plan: 'Created plan',
  update_plan: 'Updated plan', deactivate_plan: 'Deactivated plan',
};

async function loadPlans() {
  const res = await fetch('/api/admin/plans');
  if (!res.ok) return;
  const plans = await res.json();
  document.getElementById('plans').innerHTML = `
    <div class="card row-card new-plan-card">
      <div class="name" style="margin-bottom:12px">Add new plan</div>
      <input id="newPlanName" placeholder="Plan name (e.g. Basic)">
      <input id="newPlanPrice" placeholder="Price (USDT)" type="number" step="0.01">
      <input id="newPlanData" placeholder="Data limit (GB)" type="number">
      <input id="newPlanDays" placeholder="Duration (days)" type="number">
      <input id="newPlanDevices" placeholder="Max devices (optional — blank uses marzban-guard's default)" type="number">
      <button class="btn btn-primary btn-sm" onclick="createPlan()">Create plan</button>
    </div>
  ` + plans.map(p => `
    <div class="card row-card">
      <div class="row-top">
        <div class="name">${p.name} ${!p.is_active ? '(inactive)' : ''}</div>
        <span class="badge ${p.is_active ? 'badge-success' : 'badge-danger'}">$${p.price_usdt}</span>
      </div>
      <div class="row-meta">${p.data_limit_gb} GB · ${p.duration_days} days · ${p.max_devices ? p.max_devices + ' devices' : 'default device limit'}</div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" onclick="toggleEditPlan('${p.id}')">Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="togglePlanActive('${p.id}', ${p.is_active})">${p.is_active ? 'Deactivate' : 'Reactivate'}</button>
        <button class="btn btn-danger btn-sm" onclick="deletePlan('${p.id}')">Delete</button>
      </div>
      <div class="new-plan-card" id="editPlan-${p.id}" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border, #333)">
        <input id="editName-${p.id}" value="${p.name}" placeholder="Plan name">
        <input id="editPrice-${p.id}" value="${p.price_usdt}" placeholder="Price (USDT)" type="number" step="0.01">
        <input id="editData-${p.id}" value="${p.data_limit_gb}" placeholder="Data limit (GB)" type="number">
        <input id="editDays-${p.id}" value="${p.duration_days}" placeholder="Duration (days)" type="number">
        <input id="editDevices-${p.id}" value="${p.max_devices ?? ''}" placeholder="Max devices (blank uses marzban-guard's default)" type="number">
        <div style="margin:6px 0 10px">
          <label><input type="checkbox" id="editActive-${p.id}" ${p.is_active ? 'checked' : ''}> Active (shown to customers)</label>
        </div>
        <button class="btn btn-primary btn-sm" onclick="savePlan('${p.id}')">Save changes</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleEditPlan('${p.id}')">Cancel</button>
      </div>
    </div>
  `).join('');
}

function toggleEditPlan(id) {
  const el = document.getElementById(`editPlan-${id}`);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function loadBanners() {
  const res = await fetch('/api/admin/banners');
  if (!res.ok) return;
  const banners = await res.json();
  document.getElementById('banners').innerHTML = `
    <div class="card row-card new-plan-card">
      <div class="name" style="margin-bottom:12px">Add new banner</div>
      <input id="newBannerHeadline" placeholder="Headline (optional)">
      <input id="newBannerSubtext" placeholder="Subtext (optional)">
      <input id="newBannerLink" placeholder="Link URL — where clicking sends customers (optional)">
      <input id="newBannerOrder" placeholder="Sort order (lower shows first)" type="number" value="0">
      <label for="newBannerImage" style="margin-top:6px">Image</label>
      <input id="newBannerImage" type="file" accept="image/*">
      <button class="btn btn-primary btn-sm" onclick="createBanner()">Add banner</button>
      <div class="field-err" id="bannerErr"></div>
    </div>
  ` + banners.map(b => `
    <div class="card row-card">
      <div class="row-top">
        <div class="name">${b.headline || '<span class="faint">(no headline)</span>'}</div>
        <span class="badge ${b.is_active ? 'badge-success' : 'badge-neutral'}">${b.is_active ? 'Active' : 'Hidden'}</span>
      </div>
      <img src="${b.image_path}" alt="${b.headline || ''}" style="width:100%;max-width:280px;border-radius:8px;margin:8px 0;display:block">
      <div class="row-meta">${b.subtext || '—'}${b.link_url ? ' · links to ' + b.link_url : ''} · order ${b.sort_order}</div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" onclick="toggleBanner('${b.id}', ${!b.is_active})">${b.is_active ? 'Hide' : 'Show'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteBanner('${b.id}')">Delete</button>
      </div>
    </div>
  `).join('') || '<div class="empty-state">No banners yet</div>';
}

async function createBanner() {
  const image = document.getElementById('newBannerImage').files[0];
  const headline = document.getElementById('newBannerHeadline').value.trim();
  const err = document.getElementById('bannerErr');
  err.textContent = '';
  if (!image) {
    err.textContent = 'Image is required';
    return;
  }
  const form = new FormData();
  form.append('headline', headline);
  form.append('subtext', document.getElementById('newBannerSubtext').value.trim());
  form.append('link_url', document.getElementById('newBannerLink').value.trim());
  form.append('sort_order', document.getElementById('newBannerOrder').value || '0');
  form.append('image', image);

  const res = await fetch('/api/admin/banners', {method: 'POST', body: form});
  if (!res.ok) {
    const data = await res.json();
    err.textContent = data.detail || 'Could not add banner';
    return;
  }
  loadBanners();
}

async function toggleBanner(id, makeActive) {
  const form = new FormData();
  form.append('is_active', makeActive ? 'true' : 'false');
  await fetch(`/api/admin/banners/${id}`, {method: 'PUT', body: form});
  loadBanners();
}

async function deleteBanner(id) {
  if (!confirm('Delete this banner permanently?')) return;
  await fetch(`/api/admin/banners/${id}`, {method: 'DELETE'});
  loadBanners();
}

async function createPlan() {
  const devicesRaw = document.getElementById('newPlanDevices').value.trim();
  const payload = {
    name: document.getElementById('newPlanName').value.trim(),
    price_usdt: parseFloat(document.getElementById('newPlanPrice').value),
    data_limit_gb: parseInt(document.getElementById('newPlanData').value),
    duration_days: parseInt(document.getElementById('newPlanDays').value),
    max_devices: devicesRaw ? parseInt(devicesRaw) : null,
  };
  if (!payload.name || isNaN(payload.price_usdt) || !payload.data_limit_gb || !payload.duration_days) {
    showToast('Please fill in every field (price can be 0 for a free plan).', 'error');
    return;
  }
  const res = await fetch('/api/admin/plans', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (res.ok) loadPlans(); else showToast('This plan could not be created — please try again.', 'error');
}

async function savePlan(id) {
  const devicesRaw = document.getElementById(`editDevices-${id}`).value.trim();
  const payload = {
    name: document.getElementById(`editName-${id}`).value.trim(),
    price_usdt: parseFloat(document.getElementById(`editPrice-${id}`).value),
    data_limit_gb: parseInt(document.getElementById(`editData-${id}`).value),
    duration_days: parseInt(document.getElementById(`editDays-${id}`).value),
    max_devices: devicesRaw ? parseInt(devicesRaw) : null,
    is_active: document.getElementById(`editActive-${id}`).checked,
  };
  if (!payload.name || isNaN(payload.price_usdt) || !payload.data_limit_gb || !payload.duration_days) {
    showToast('Please fill in every field (price can be 0 for a free plan).', 'error');
    return;
  }
  const res = await fetch(`/api/admin/plans/${id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (res.ok) { showToast('Plan updated.', 'success'); loadPlans(); }
  else showToast('Could not update this plan — please try again.', 'error');
}

async function togglePlanActive(id, currentlyActive) {
  const res = await fetch(`/api/admin/plans/${id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({is_active: !currentlyActive})
  });
  if (res.ok) loadPlans();
  else showToast('Could not update this plan — please try again.', 'error');
}

async function deletePlan(id) {
  if (!confirm(
    "Delete this plan? If it's never been ordered, it will be permanently removed. "
    + "Otherwise (past orders reference it) it will be deactivated instead."
  )) return;
  const res = await fetch(`/api/admin/plans/${id}`, {method: 'DELETE'});
  if (!res.ok) {
    showToast('Could not delete this plan — please try again.', 'error');
    return;
  }
  const data = await res.json().catch(() => ({}));
  showToast(data.deleted ? 'Plan permanently deleted.' : 'This plan has order history — deactivated instead.', 'success');
  loadPlans();
}

function auditRowHtml(l) {
  return `
    <div class="list-row">
      <div class="lr-main">
        <div class="lr-title">${actionLabels[l.action] || l.action}</div>
        <div class="lr-sub">Target: ${l.target}${l.detail ? ' — ' + l.detail : ''}</div>
      </div>
      <div class="lr-right"><span class="faint" style="font-size:12px">${new Date(l.created_at).toLocaleString('en-US')}</span></div>
    </div>
  `;
}

async function loadAuditLog(reset = true) {
  if (reset) { auditPage = 1; }
  const params = new URLSearchParams({page: auditPage, page_size: PAGE_SIZE});
  const res = await fetch(`/api/admin/audit-log?${params}`);
  if (!res.ok) return;
  const data = await res.json();
  const container = document.getElementById('auditRows');
  const html = data.items.map(auditRowHtml).join('');
  if (reset) {
    container.innerHTML = html || '<div class="empty-state">No activity logged yet</div>';
  } else {
    container.insertAdjacentHTML('beforeend', html);
  }
  document.getElementById('auditCount').textContent = `${data.total} total`;
  document.getElementById('auditLoadMoreRow').style.display = auditPage * PAGE_SIZE < data.total ? 'block' : 'none';
}

function loadMoreAuditLog() { auditPage++; loadAuditLog(false); }
</script>
