<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | {{ site_name }}</title>
{% include "_fonts.html" %}
<style>
  .page-wrap { padding: 40px 16px 100px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 360px; padding: 32px; }
  .login-brand { text-align: center; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .login-card h2 { font-size: 16px; margin: 4px 0 22px; text-align: center; color: var(--text-dim); font-weight: 500; }

  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }

  .stats-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card {
    flex: 1 1 140px; padding: 13px 16px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--panel); backdrop-filter: blur(20px); cursor: pointer; text-align: left;
    transition: border-color 0.15s ease, transform 0.15s ease;
    font: inherit; color: inherit; -webkit-appearance: none; appearance: none;
  }
  .stat-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .stat-card .stat-num { font-size: 21px; font-weight: 700; font-family: var(--font-display); line-height: 1.1; }
  .stat-card .stat-label { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }
  .stat-card.attention { border-color: rgba(251,191,36,0.45); background: var(--warning-soft); }
  .stat-card.attention .stat-num { color: var(--warning); }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 2px; position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 4px; }
  .tab { padding: 9px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--text-dim); white-space: nowrap; display: flex; align-items: center; }
  .tab.active { background: var(--gradient); color: #05060a; border-color: transparent; }
  .tab-badge {
    display: none; align-items: center; justify-content: center; min-width: 17px; height: 17px; padding: 0 4px;
    border-radius: 999px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; margin-inline-start: 7px;
  }
  .tab.active .tab-badge { background: rgba(5,6,10,0.25); color: #05060a; }

  .row-card { padding: 15px 18px; margin-bottom: 10px; font-size: 13px; }
  .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 10px; }
  .chevron-icon { width: 16px; height: 16px; flex: 0 0 16px; color: var(--text-dim); transition: transform 0.2s ease; }
  .chevron-icon.open { transform: rotate(180deg); }
  .ticket-body { margin-top: 4px; }
  .row-card.ticket-needs-reply { border-color: rgba(251,191,36,0.4); }
  .row-card.ticket-open { border-color: var(--accent); background: var(--accent-soft); }
  .name { font-weight: 600; font-size: 14px; }
  .row-meta { color: var(--text-dim); font-size: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .field-err { color: var(--danger); font-size: 12.5px; margin-top: 8px; }

  .msg { font-size: 12.5px; padding: 9px 11px; border-radius: 8px; margin-bottom: 6px; line-height: 1.6; }
  .msg.customer { background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
  .msg.admin { background: var(--accent-soft); border: 1px solid rgba(124,92,255,0.3); }

  .new-plan-card input { margin-bottom: 10px; }
  .empty-state { color: var(--text-faint); font-size: 13px; padding: 16px; }

  .list-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .list-toolbar input, .list-toolbar select { margin-bottom: 0; width: auto; min-width: 200px; }
  .list-count { color: var(--text-faint); font-size: 12.5px; margin-inline-start: auto; white-space: nowrap; }

  .list-container { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); backdrop-filter: blur(20px); overflow: hidden; }
  .list-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .list-row:last-child { border-bottom: none; }
  .lr-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lr-title { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lr-sub { color: var(--text-dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .lr-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .load-more-row { text-align: center; padding: 14px; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<main>

<div class="login-wrap" id="loginCard">
  <div class="card login-card fade-up">
    <div class="login-brand"><span class="brand-name" style="background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent">{{ site_name }}</span></div>
    <h2>Admin sign in</h2>
    <label for="adminUser">Username</label>
    <input id="adminUser" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username">
    <label for="adminPass">Password</label>
    <input id="adminPass" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password">
    <button class="btn btn-primary btn-block" onclick="adminLogin()">Log in</button>
    <div class="field-err" id="loginErr"></div>
  </div>
</div>

<div class="page-wrap" id="panel" style="display:none">
  <div class="container">
    <div class="admin-header">
      <span class="brand"><span class="brand-mark">F</span><span class="brand-name">{{ site_name }}</span><span class="muted" style="font-size:13px;margin-left:6px">Admin</span></span>
      <button class="btn btn-ghost btn-sm" onclick="adminLogout()">Log out</button>
    </div>
    <div class="stats-strip" id="statsStrip"></div>
    <div class="tabs" role="tablist">
      <div class="tab active" data-tab="customers" role="tab" tabindex="0" aria-selected="true">Customers</div>
      <div class="tab" data-tab="orders" role="tab" tabindex="0" aria-selected="false">Orders<span class="tab-badge" id="tabBadgeOrders"></span></div>
      <div class="tab" data-tab="tickets" role="tab" tabindex="0" aria-selected="false">Support<span class="tab-badge" id="tabBadgeTickets"></span></div>
      <div class="tab" data-tab="plans" role="tab" tabindex="0" aria-selected="false">Plans</div>
      <div class="tab" data-tab="banners" role="tab" tabindex="0" aria-selected="false">Banners</div>
      <div class="tab" data-tab="blog" role="tab" tabindex="0" aria-selected="false">Blog</div>
      <div class="tab" data-tab="auditlog" role="tab" tabindex="0" aria-selected="false">Activity log</div>
    </div>
    <div id="customers">
      <div class="list-toolbar">
        <input type="text" id="customerSearch" placeholder="Search username or email…">
        <span class="list-count" id="customerCount"></span>
      </div>
      <div class="list-container" id="customerRows"></div>
      <div class="load-more-row" id="customerPaginationRow" style="display:none">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px">
          <button class="btn btn-ghost btn-sm" id="customerPrevBtn" onclick="changeCustomersPage(-1)">← Prev</button>
          <span id="customerPageIndicator" style="font-size:12.5px;color:var(--text-dim)"></span>
          <button class="btn btn-ghost btn-sm" id="customerNextBtn" onclick="changeCustomersPage(1)">Next →</button>
        </div>
      </div>
    </div>

    <div id="orders" style="display:none">
      <div class="list-toolbar">
        <input type="text" id="orderSearch" placeholder="Search username or plan…">
        <select id="orderStatusFilter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="paid">Paid</option>
          <option value="provisioned">Active</option>
          <option value="expired">Expired</option>
          <option value="failed">Failed</option>
        </select>
        <span class="list-count" id="orderCount"></span>
      </div>
      <div class="list-container" id="orderRows"></div>
      <div class="load-more-row" id="orderPaginationRow" style="display:none">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px">
          <button class="btn btn-ghost btn-sm" id="orderPrevBtn" onclick="changeOrdersPage(-1)">← Prev</button>
          <span id="orderPageIndicator" style="font-size:12.5px;color:var(--text-dim)"></span>
          <button class="btn btn-ghost btn-sm" id="orderNextBtn" onclick="changeOrdersPage(1)">Next →</button>
        </div>
      </div>
    </div>

    <div id="tickets" style="display:none">
      <div class="list-toolbar">
        <input type="text" id="ticketSearch" placeholder="Search username or subject…">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);margin:0">
          <input type="checkbox" id="ticketOpenOnly" style="width:auto;margin:0" onchange="loadTickets()"> Open only
        </label>
        <span class="list-count" id="ticketCount"></span>
      </div>
      <div id="ticketCards"></div>
      <div class="load-more-row" id="ticketPaginationRow" style="display:none">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px">
          <button class="btn btn-ghost btn-sm" id="ticketPrevBtn" onclick="changeTicketsPage(-1)">← Prev</button>
          <span id="ticketPageIndicator" style="font-size:12.5px;color:var(--text-dim)"></span>
          <button class="btn btn-ghost btn-sm" id="ticketNextBtn" onclick="changeTicketsPage(1)">Next →</button>
        </div>
      </div>
    </div>

    <div id="plans" style="display:none"></div>
    <div id="banners" style="display:none"></div>
    <div id="blog" style="display:none"></div>

    <div id="auditlog" style="display:none">
      <div class="list-toolbar">
        <span class="list-count" id="auditCount"></span>
      </div>
      <div class="list-container" id="auditRows"></div>
      <div class="load-more-row" id="auditPaginationRow" style="display:none">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px">
          <button class="btn btn-ghost btn-sm" id="auditPrevBtn" onclick="changeAuditPage(-1)">← Prev</button>
          <span id="auditPageIndicator" style="font-size:12.5px;color:var(--text-dim)"></span>
          <button class="btn btn-ghost btn-sm" id="auditNextBtn" onclick="changeAuditPage(1)">Next →</button>
        </div>
      </div>
    </div>
  </div>
</div>

</main>

{% include "_footer.html" %}

<script>
// admin.html doesn't include _nav.html (no site header here), so it never
// loads nav.js — this page's own copy of the same role="button"/role="tab"
// Enter/Space activation (ticket rows, the tab strip below).
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"], [role="tab"]')) {
    e.preventDefault();
    e.target.click();
  }
});

function activateTab(tabName) {
  document.querySelectorAll('.tab').forEach(x => {
    const active = x.dataset.tab === tabName;
    x.classList.toggle('active', active);
    x.setAttribute('aria-selected', String(active));
  });
  ['customers','orders','tickets','plans','banners','blog','auditlog'].forEach(id => {
    document.getElementById(id).style.display = id === tabName ? 'block' : 'none';
  });
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => activateTab(t.dataset.tab)));

function setBadge(id, count) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = count > 0 ? 'inline-flex' : 'none';
  el.textContent = count > 99 ? '99+' : count;
}

async function loadStats() {
  const res = await fetch('/api/admin/stats');
  if (!res.ok) return;
  const s = await res.json();
  document.getElementById('statsStrip').innerHTML = `
    <button type="button" class="stat-card" onclick="activateTab('customers')">
      <div class="stat-num">${s.total_customers}</div>
      <div class="stat-label">Customers</div>
    </button>
    <button type="button" class="stat-card ${s.banned_customers > 0 ? 'attention' : ''}" onclick="activateTab('customers')">
      <div class="stat-num">${s.banned_customers}</div>
      <div class="stat-label">Suspended</div>
    </button>
    <button type="button" class="stat-card ${s.orders_needing_confirm > 0 ? 'attention' : ''}" onclick="goToOrdersNeedingConfirm()">
      <div class="stat-num">${s.orders_needing_confirm}</div>
      <div class="stat-label">Payments to verify</div>
    </button>
    <button type="button" class="stat-card ${s.tickets_needing_reply > 0 ? 'attention' : ''}" onclick="goToTicketsNeedingReply()">
      <div class="stat-num">${s.tickets_needing_reply}</div>
      <div class="stat-label">Tickets awaiting reply</div>
    </button>
    <button type="button" class="stat-card" onclick="activateTab('tickets')">
      <div class="stat-num">${s.open_tickets}</div>
      <div class="stat-label">Open tickets</div>
    </button>
  `;
  setBadge('tabBadgeOrders', s.orders_needing_confirm);
  setBadge('tabBadgeTickets', s.tickets_needing_reply);
}

function goToOrdersNeedingConfirm() {
  activateTab('orders');
  loadOrders(true);
}

function goToTicketsNeedingReply() {
  activateTab('tickets');
  document.getElementById('ticketOpenOnly').checked = true;
  loadTickets(true);
}

function showAdminPanel() {
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadCustomers(); loadOrders(); loadTickets(); loadAuditLog(); loadPlans(); loadBanners(); loadBlog(); loadStats();
}

async function adminLogout() {
  await fetch('/api/admin/logout', {method: 'POST'});
  document.getElementById('panel').style.display = 'none';
  document.getElementById('loginCard').style.display = 'flex';
  document.getElementById('adminUser').value = '';
  document.getElementById('adminPass').value = '';
}

async function adminLogin() {
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      // .trim() only on username — a mobile keyboard's predictive text can
      // tack on a trailing space that's invisible in the input box. Never
      // trim the password: a space could legitimately be part of it, and
      // silently altering it would be surprising.
      username: document.getElementById('adminUser').value.trim(),
      password: document.getElementById('adminPass').value
    })
  });
  if (!res.ok) {
    document.getElementById('loginErr').textContent = 'Login failed';
    return;
  }
  showAdminPanel();
}

// The session cookie set by /api/admin/login is still valid across page
// reloads (it isn't tied to any per-tab state) — without this check the
// login form showed unconditionally on every refresh, forcing a re-login
// even though the browser still held a perfectly good session.
(async function checkExistingAdminSession() {
  const res = await fetch('/api/admin/stats');
  if (res.ok) showAdminPanel();
})();

const ADMIN_PAGE_SIZE = 10;
// Not cached across calls — always fresh so a plan created after the
// Customers tab was first opened still shows up in the "Grant plan"
// picker without needing a full page reload.
let grantPlansCache = [];
async function getGrantPlansCache() {
  // The picker needs every plan, not one page of them — page_size here is
  // just a generous ceiling, not real pagination (the Plans tab list itself
  // is what's paginated).
  const res = await fetch('/api/admin/plans?page_size=500');
  grantPlansCache = res.ok ? (await res.json()).items : [];
  return grantPlansCache;
}
let customerPage = 1, customerSearchTimer = null;
let orderPage = 1, orderSearchTimer = null;
let ticketPage = 1;
let auditPage = 1;

// Shared prev/next pagination bar — every growing admin list (customers,
// orders, tickets, audit log) uses the same {prefix}PaginationRow /
// {prefix}PageIndicator / {prefix}PrevBtn / {prefix}NextBtn markup.
function renderPaginationBar(prefix, page, total) {
  const totalPages = Math.max(1, Math.ceil(total / ADMIN_PAGE_SIZE));
  document.getElementById(`${prefix}PaginationRow`).style.display = total > ADMIN_PAGE_SIZE ? 'block' : 'none';
  document.getElementById(`${prefix}PageIndicator`).textContent = `Page ${page} of ${totalPages}`;
  document.getElementById(`${prefix}PrevBtn`).disabled = page <= 1;
  document.getElementById(`${prefix}NextBtn`).disabled = page >= totalPages;
}

function customerRowHtml(c) {
  const canGrant = !c.is_deleted && !c.is_banned;
  const planOptions = (grantPlansCache || []).map(p =>
    `<option value="${p.id}">${escapeHtml(p.name)} — $${p.price_usdt}</option>`
  ).join('');
  return `
    <div class="list-row">
      <div class="lr-main">
        <div class="lr-title">${escapeHtml(c.username)}</div>
        <div class="lr-sub">${c.email ? escapeHtml(c.email) + (c.email_verified ? ' ✅' : ' (unverified)') : 'No email on file'} · ${escapeHtml(c.contact || '—')} · ${new Date(c.created_at).toLocaleDateString('en-US')}${c.is_banned && !c.is_deleted ? ' · Reason: ' + escapeHtml(c.ban_reason) : ''}</div>
      </div>
      <div class="lr-right">
        <span class="badge ${c.is_deleted ? 'badge-neutral' : c.is_banned ? 'badge-danger' : 'badge-success'}">${c.is_deleted ? 'Deleted' : c.is_banned ? 'Suspended' : 'Active'}</span>
        ${c.is_deleted ? '' : `
          <div class="lr-actions">
            ${c.is_banned
              ? `<button class="btn btn-ghost btn-sm" onclick="unban('${c.id}')">Lift</button>`
              : `<button class="btn btn-danger btn-sm" onclick="banPrompt('${c.id}')">Suspend</button>`}
            ${canGrant ? `<button class="btn btn-ghost btn-sm" onclick="toggleGrantPlan('${c.id}')">Grant plan</button>` : ''}
          </div>
        `}
      </div>
    </div>
    ${canGrant ? `
      <div class="new-plan-card" id="grantPlan-${c.id}" style="display:none; margin-top:10px; padding-top:12px; border-top:1px solid var(--border, #333)">
        <label>Plan to grant (at no charge — logged in the activity log)</label>
        <select id="grantPlanSelect-${c.id}">${planOptions}</select>
        <label>Note (optional — shown in the activity log)</label>
        <input id="grantPlanNote-${c.id}" placeholder="e.g. compensation for a support issue">
        <button class="btn btn-primary btn-sm" onclick="submitGrantPlan('${c.id}')">Grant</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleGrantPlan('${c.id}')">Cancel</button>
        <div class="field-err" id="grantPlanErr-${c.id}"></div>
      </div>
    ` : ''}
  `;
}

function toggleGrantPlan(id) {
  const el = document.getElementById(`grantPlan-${id}`);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function submitGrantPlan(customerId) {
  const planId = document.getElementById(`grantPlanSelect-${customerId}`).value;
  const note = document.getElementById(`grantPlanNote-${customerId}`).value.trim();
  const err = document.getElementById(`grantPlanErr-${customerId}`);
  err.textContent = '';
  if (!planId) { err.textContent = 'No plans exist yet — create one in the Plans tab first.'; return; }

  const res = await fetch(`/api/admin/customers/${customerId}/grant-plan`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({plan_id: planId, note: note || null}),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    err.textContent = data.detail || 'Could not grant this plan.';
    return;
  }
  const data = await res.json();
  if (data.status === 'provisioned') {
    showToast('Plan granted and provisioned.', 'success');
  } else {
    showToast('Order created but provisioning failed — check the activity log and Marzban directly.', 'error');
  }
  loadCustomers(false);
  loadStats();
}

async function loadCustomers(reset = true) {
  if (reset) { customerPage = 1; }
  const search = document.getElementById('customerSearch').value.trim();
  const params = new URLSearchParams({page: customerPage, page_size: ADMIN_PAGE_SIZE, search});
  const [res] = await Promise.all([fetch(`/api/admin/customers?${params}`), getGrantPlansCache()]);
  if (!res.ok) return;
  const data = await res.json();
  const container = document.getElementById('customerRows');
  container.innerHTML = data.items.map(customerRowHtml).join('') || '<div class="empty-state">No customers found</div>';
  document.getElementById('customerCount').textContent = `${data.total} total`;
  renderPaginationBar('customer', customerPage, data.total);
}

function changeCustomersPage(delta) { customerPage += delta; loadCustomers(false); }

document.getElementById('customerSearch').addEventListener('input', () => {
  clearTimeout(customerSearchTimer);
  customerSearchTimer = setTimeout(() => loadCustomers(true), 350);
});

async function banPrompt(id) {
  const reason = prompt('Enter a reason for suspension:');
  if (!reason) return;
  await fetch(`/api/admin/customers/${id}/ban`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reason})
  });
  loadCustomers(true);
  loadStats();
}

async function unban(id) {
  await fetch(`/api/admin/customers/${id}/unban`, {method: 'POST'});
  loadCustomers(true);
  loadStats();
}

function statusLabel(s) {
  return {pending: 'Pending', paid: 'Paid', provisioned: 'Active', expired: 'Expired', failed: 'Failed', cancelled: 'Cancelled'}[s] || s;
}

function orderRowHtml(o) {
  return `
    <div class="list-row">
      <div class="lr-main">
        <div class="lr-title">${escapeHtml(o.customer_username)} — ${escapeHtml(o.plan_name)}</div>
        <div class="lr-sub">$${o.amount_due} ${o.is_renewal ? '(renewal)' : '(new)'} · ${o.payment_method === 'card' ? 'Card (Stripe)' : o.payment_method === 'crypto' ? `Crypto (USDT-${o.crypto_network === 'polygon' ? 'Polygon' : 'TRC20'})` : 'Free'} · ${new Date(o.created_at).toLocaleString('en-US')}</div>
      </div>
      <div class="lr-right">
        <span class="badge ${o.status === 'provisioned' ? 'badge-success' : o.status === 'pending' ? 'badge-warning' : 'badge-danger'}">${statusLabel(o.status)}</span>
        <div class="lr-actions">
          ${(o.status === 'pending' || o.status === 'failed') && o.payment_method === 'crypto'
            ? `<button class="btn btn-ghost btn-sm" onclick="confirmOrder('${o.id}')">Confirm manually</button>`
            : ''}
          ${o.status === 'provisioned' && o.marzban_username
            ? `<button class="btn btn-ghost btn-sm" onclick="toggleGuardPanel('${o.id}')">VPN Guard</button>`
            : ''}
        </div>
      </div>
    </div>
    ${o.status === 'provisioned' && o.marzban_username ? `
      <div class="new-plan-card" id="guardPanel-${o.id}" style="display:none; margin-top:10px; padding-top:12px; border-top:1px solid var(--border, #333)">
        <div id="guardPanelBody-${o.id}">Loading…</div>
      </div>
    ` : ''}
  `;
}

const guardPanelLoaded = new Set();

function guardStatusBadgeClass(status) {
  return status === 'active' ? 'badge-success' : status === 'suspended' ? 'badge-warning' : 'badge-danger';
}

function guardPanelHtml(orderId, data) {
  if (!data.configured) {
    return `<div class="row-meta">marzban-guard isn't configured on this server (MARZBAN_GUARD_BASE_URL unset).</div>`;
  }
  if (!data.reachable) {
    return `
      <div class="row-meta" style="color:var(--danger)">Couldn't reach marzban-guard right now — try again shortly.</div>
      <button class="btn btn-ghost btn-sm" onclick="loadGuardStatus('${orderId}', true)" style="margin-top:8px">Retry</button>
    `;
  }
  if (!data.status) {
    // marzban-guard only creates a record once a detector actually
    // triggers on this account — no status back means it's simply never
    // been flagged, not that something's wrong.
    return `<div class="row-meta"><span class="badge badge-success">clean</span> No violations recorded — this account has never triggered marzban-guard.</div>`;
  }
  const canReactivate = data.status !== 'active';
  return `
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
      <span class="badge ${guardStatusBadgeClass(data.status)}">${escapeHtml(data.status || 'unknown')}</span>
      <span class="row-meta">score: ${data.risk_score != null ? Math.round(data.risk_score) : '—'}</span>
      <span class="row-meta">last seen: ${data.last_seen_at ? new Date(data.last_seen_at).toLocaleString('en-US') : '—'}</span>
    </div>
    ${data.status_reason ? `<div class="row-meta" style="margin-top:6px">Reason: ${escapeHtml(data.status_reason)}</div>` : ''}
    ${canReactivate
      ? `<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="reactivateGuard('${orderId}')">Reactivate</button>`
      : ''}
  `;
}

async function loadGuardStatus(orderId, force = false) {
  const body = document.getElementById(`guardPanelBody-${orderId}`);
  if (!body) return;
  if (force) guardPanelLoaded.delete(orderId);
  body.innerHTML = 'Loading…';
  const res = await fetch(`/api/admin/orders/${orderId}/marzban-guard-status`);
  if (!res.ok) {
    body.innerHTML = `<div class="row-meta" style="color:var(--danger)">Couldn't load status.</div>`;
    return;
  }
  const data = await res.json();
  body.innerHTML = guardPanelHtml(orderId, data);
  guardPanelLoaded.add(orderId);
}

function toggleGuardPanel(orderId) {
  const el = document.getElementById(`guardPanel-${orderId}`);
  const opening = el.style.display === 'none';
  el.style.display = opening ? 'block' : 'none';

}

async function reactivateGuard(orderId) {
  if (!confirm('Reactivate this account in marzban-guard? Only do this if you\'ve verified the restriction was a mistake.')) return;
  const res = await fetch(`/api/admin/orders/${orderId}/marzban-guard-reactivate`, {method: 'POST'});

}

// Safe for text-node AND quoted-attribute-value context (unlike a bare
// textContent->innerHTML round trip, which leaves " and ' untouched since
// browsers don't need to escape them in plain text — but this codebase
// interpolates the result into attributes like value="..." too).
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]
  ));
}

// Which tickets are expanded survives a re-render (search/reply/close all
// reload the list) so acting on a ticket doesn't collapse it back under you.
const openAdminTicketIds = new Set();

function ticketCardHtml(t) {
  const contactLine = t.customer_id
    ? ''
    : `<div class="row-meta" style="margin-top:4px">Guest contact: ${escapeHtml(t.guest_contact || '—')}</div>`;
  const identityLine = t.registered_email
    ? `<div class="row-meta" style="margin-top:2px${t.identity_mismatch ? ';color:var(--danger)' : ''}">
         Registered account email: ${escapeHtml(t.registered_email)}${t.identity_mismatch ? ' — does not match the contact above, verify identity before acting on this ticket' : ''}
       </div>`
    : '';
  const isOpen = openAdminTicketIds.has(t.id);
  const cardClass = isOpen ? 'ticket-open' : (t.needs_reply ? 'ticket-needs-reply' : '');
  return `
    <div class="card row-card ${cardClass}" id="ticket-card-${t.id}">
      <div class="row-top" style="cursor:pointer" role="button" tabindex="0" aria-expanded="${isOpen}" onclick="toggleAdminTicket('${t.id}')">
        <div class="name">${escapeHtml(t.customer_username)} — ${escapeHtml(t.subject)}</div>
        <div style="display:flex;gap:6px;align-items:center">
          ${t.needs_reply ? '<span class="badge badge-warning">Needs reply</span>' : ''}
          <span class="badge ${t.status === 'open' ? 'badge-warning' : 'badge-neutral'}">${t.status === 'open' ? 'Open' : 'Closed'}</span>
          <svg class="chevron-icon${isOpen ? ' open' : ''}" id="chev-${t.id}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="ticket-body" id="ticket-body-${t.id}" style="display:${isOpen ? 'block' : 'none'}">
        ${contactLine}
        ${identityLine}
        ${t.messages.map(m => `
          <div class="msg ${m.sender}">
            ${escapeHtml(m.body)}
            ${m.attachment_path ? `<a href="${m.attachment_path}" target="_blank" rel="noopener"><img src="${m.attachment_path}" style="max-width:220px;max-height:160px;border-radius:8px;display:block;margin-top:8px;border:1px solid var(--border)" alt="" loading="lazy" decoding="async"></a>` : ''}
          </div>
        `).join('')}
        <textarea id="reply-${t.id}" rows="2" placeholder="Write a reply..." style="margin-top:10px"></textarea>
        <input id="replyFile-${t.id}" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="margin-top:8px">
        <div class="actions">
          <button class="btn btn-primary btn-sm" onclick="replyTicket('${t.id}')">Send reply</button>
          ${t.status === 'open' ? `<button class="btn btn-ghost btn-sm" onclick="closeTicket('${t.id}')">Close ticket</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function toggleAdminTicket(id) {
  const body = document.getElementById(`ticket-body-${id}`);
  const chevron = document.getElementById(`chev-${id}`);
  const card = document.getElementById(`ticket-card-${id}`);
  const header = card.querySelector('.row-top');
  const opening = body.style.display === 'none';
  body.style.display = opening ? 'block' : 'none';
  chevron.classList.toggle('open', opening);
  card.classList.toggle('ticket-open', opening);
  header.setAttribute('aria-expanded', opening);
  if (opening) { openAdminTicketIds.add(id); } else { openAdminTicketIds.delete(id); }
}

async function replyTicket(id) {
  const message = document.getElementById(`reply-${id}`).value.trim();
  if (!message) return;
  const form = new FormData();
  form.set('message', message);
  const file = document.getElementById(`replyFile-${id}`).files[0];

  const res = await fetch(`/api/admin/tickets/${id}/reply`, { method: 'POST', body: form });
  if (!res.ok) {
    let msg = 'Could not send reply — please try again.';
    try {
      const data = await res.json();
      if (typeof data.detail === 'string') msg = data.detail;
    } catch (e) {}
    showToast(msg, 'error');
    return;

  loadTickets(true);
  loadStats();
}

async function createBanner() {
  const image = document.getElementById('newBannerImage').files[0];
  const headline = document.getElementById('newBannerHeadline').value.trim();
  const err = document.getElementById('bannerErr');
  err.textContent = '';
  if (!image) {
    err.textContent = 'Image is required';
    return;
  }
  const form = new FormData();
  form.append('headline', headline);
  form.append('subtext', document.getElementById('newBannerSubtext').value.trim());
  form.append('link_url', document.getElementById('newBannerLink').value.trim());
  form.append('sort_order', document.getElementById('newBannerOrder').value || '0');
  form.append('image', image);

  const res = await fetch('/api/admin/banners', {method: 'POST', body: form});
  if (!res.ok) {
    const data = await res.json();
    err.textContent = data.detail || 'Could not add banner';
    return;
  }
  loadBanners();
}

  const search = document.getElementById('blogSearch')?.value.trim() || '';
  const params = new URLSearchParams({page: blogPage, page_size: ADMIN_PAGE_SIZE, q: search});
  const res = await fetch(`/api/admin/blog/posts?${params}`);
  if (!res.ok) return;
  const data = await res.json();

  document.getElementById('blog').innerHTML = `
    <div class="card row-card new-plan-card">
      <div class="name" style="margin-bottom:12px">Categories</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        ${blogCategories.map(c => `<span class="badge badge-neutral">${escapeHtml(c.name_en)} <a href="#" onclick="deleteBlogCategory('${c.id}');return false" style="margin-inline-start:6px;color:var(--danger)">✕</a></span>`).join('') || '<span class="faint" style="font-size:12.5px">No categories yet.</span>'}
      </div>
      <input id="newCatNameEn" placeholder="Category name (English)">
      <input id="newCatNameFa" placeholder="Category name (Persian)" dir="rtl">
      <button class="btn btn-ghost btn-sm" onclick="createBlogCategory()">Add category</button>
    </div>

    <div class="card row-card new-plan-card">
      <div class="name" style="margin-bottom:12px">Tags</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
        ${blogTags.map(t => `<span class="badge badge-neutral">${escapeHtml(t.name_en)} <a href="#" onclick="deleteBlogTag('${t.id}');return false" style="margin-inline-start:6px;color:var(--danger)">✕</a></span>`).join('') || '<span class="faint" style="font-size:12.5px">No tags yet.</span>'}
      </div>
      <input id="newTagNameEn" placeholder="Tag name (English)">
      <input id="newTagNameFa" placeholder="Tag name (Persian)" dir="rtl">
      <button class="btn btn-ghost btn-sm" onclick="createBlogTag()">Add tag</button>
    </div>

    <div class="card row-card new-plan-card">
      <div class="name" style="margin-bottom:12px">Write new post</div>
      <label>Title (English)</label>
      <textarea id="newBlogTitleEn" rows="1"></textarea>
      <label>Title (Persian)</label>
      <textarea id="newBlogTitleFa" rows="1" dir="rtl"></textarea>
      <label>Excerpt (English) — also the meta description</label>
      <textarea id="newBlogExcerptEn" rows="2"></textarea>
      <label>Excerpt (Persian)</label>
      <textarea id="newBlogExcerptFa" rows="2" dir="rtl"></textarea>
      <label>Content (English, HTML — use &lt;h2&gt;/&lt;h3&gt; for section headings, they build the table of contents automatically)</label>
      <textarea id="newBlogContentEn" rows="8" style="font-family:monospace;font-size:12px"></textarea>
      <label>Content (Persian, HTML)</label>
      <textarea id="newBlogContentFa" rows="8" style="font-family:monospace;font-size:12px" dir="rtl"></textarea>
      <label>Author</label>
      <input id="newBlogAuthor" placeholder="Freemiga Team">
      <label>Category</label>
      <select id="newBlogCategory">${blogCategoryOptions(null)}</select>
      <label style="margin-top:8px">Tags</label>
      <div style="margin-bottom:8px">${blogTagCheckboxes('newBlogPost', [])}</div>
      <label>Status</label>
      <select id="newBlogStatus">
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>
      <label style="margin-top:8px">Featured image</label>
      <input id="newBlogFeaturedImage" type="file" accept="image/*">
      <label>OG image (optional — falls back to featured image)</label>
      <input id="newBlogOgImage" type="file" accept="image/*">
      <div style="margin-top:12px">
        <button class="btn btn-primary btn-sm" onclick="createBlogPost()">Create post</button>
      </div>
      <div class="field-err" id="newBlogPostErr"></div>
    </div>

    <div class="list-toolbar">
      <input type="text" id="blogSearch" placeholder="Search post titles…" value="${escapeHtml(search)}">
      <span class="list-count">${data.total} total</span>
    </div>
    ${data.items.map(blogPostRowHtml).join('') || '<div class="empty-state">No posts yet</div>'}
    <div class="load-more-row" style="display:${data.total > ADMIN_PAGE_SIZE ? 'block' : 'none'}">
      <div style="display:flex;align-items:center;justify-content:center;gap:14px">
        <button class="btn btn-ghost btn-sm" ${blogPage <= 1 ? 'disabled' : ''} onclick="changeBlogPage(-1)">← Prev</button>
        <span style="font-size:12.5px;color:var(--text-dim)">Page ${blogPage} of ${Math.max(1, Math.ceil(data.total / ADMIN_PAGE_SIZE))}</span>
        <button class="btn btn-ghost btn-sm" ${blogPage >= Math.ceil(data.total / ADMIN_PAGE_SIZE) ? 'disabled' : ''} onclick="changeBlogPage(1)">Next →</button>
      </div>
    </div>
  `;

  document.getElementById('blogSearch').addEventListener('input', () => {
    clearTimeout(blogSearchTimer);
    blogSearchTimer = setTimeout(() => loadBlog(true), 350);
  });
}

function changeBlogPage(delta) { blogPage += delta; loadBlog(false); }

async function createBlogCategory() {
  const name_en = document.getElementById('newCatNameEn').value.trim();
  const name_fa = document.getElementById('newCatNameFa').value.trim();
  if (!name_en || !name_fa) { showToast('Category name is required in both languages.', 'error'); return; }
  const form = new FormData();
  form.append('name_en', name_en); form.append('name_fa', name_fa);
  const res = await fetch('/api/admin/blog/categories', {method: 'POST', body: form});
  if (res.ok) loadBlog(false); else showToast('Could not create category.', 'error');
}

async function deleteBlogCategory(id) {
  if (!confirm('Delete this category? Posts using it will become uncategorized.')) return;
  await fetch(`/api/admin/blog/categories/${id}`, {method: 'DELETE'});
  loadBlog(false);
}

async function createBlogTag() {
  const name_en = document.getElementById('newTagNameEn').value.trim();
  const name_fa = document.getElementById('newTagNameFa').value.trim();
  if (!name_en || !name_fa) { showToast('Tag name is required in both languages.', 'error'); return; }
  const form = new FormData();
  form.append('name_en', name_en); form.append('name_fa', name_fa);
  const res = await fetch('/api/admin/blog/tags', {method: 'POST', body: form});
  if (res.ok) loadBlog(false); else showToast('Could not create tag.', 'error');
}

async function deleteBlogTag(id) {
  if (!confirm('Delete this tag?')) return;
  await fetch(`/api/admin/blog/tags/${id}`, {method: 'DELETE'});
  loadBlog(false);
}

async function createBlogPost() {
  const err = document.getElementById('newBlogPostErr');
  err.textContent = '';
  const titleEn = document.getElementById('newBlogTitleEn').value.trim();
  const titleFa = document.getElementById('newBlogTitleFa').value.trim();
  const excerptEn = document.getElementById('newBlogExcerptEn').value.trim();
  const excerptFa = document.getElementById('newBlogExcerptFa').value.trim();
  const contentEn = document.getElementById('newBlogContentEn').value.trim();
  const contentFa = document.getElementById('newBlogContentFa').value.trim();
  if (!titleEn || !titleFa || !excerptEn || !excerptFa || !contentEn || !contentFa) {
    err.textContent = 'Title, excerpt, and content are required in both languages.';
    return;
  }
  const form = new FormData();
  form.append('title_en', titleEn); form.append('title_fa', titleFa);
  form.append('excerpt_en', excerptEn); form.append('excerpt_fa', excerptFa);
  form.append('content_en', contentEn); form.append('content_fa', contentFa);
  form.append('author', document.getElementById('newBlogAuthor').value.trim());
  form.append('category_id', document.getElementById('newBlogCategory').value);
  form.append('status', document.getElementById('newBlogStatus').value);
  form.append('tag_ids', collectCheckedTagIds('newBlogPost'));
  const featuredImage = document.getElementById('newBlogFeaturedImage').files[0];
  if (featuredImage) form.append('featured_image', featuredImage);
  const ogImage = document.getElementById('newBlogOgImage').files[0];
  if (ogImage) form.append('og_image', ogImage);

  const res = await fetch('/api/admin/blog/posts', {method: 'POST', body: form});
  if (!res.ok) { err.textContent = 'Could not create post — please check every field.'; return; }
  loadBlog(true);
}

async function saveBlogPost(id) {
  const err = document.getElementById(`editBlogPostErr-${id}`);
  err.textContent = '';
  const form = new FormData();
  form.append('title_en', document.getElementById(`editBlogTitleEn-${id}`).value.trim());
  form.append('title_fa', document.getElementById(`editBlogTitleFa-${id}`).value.trim());
  form.append('excerpt_en', document.getElementById(`editBlogExcerptEn-${id}`).value.trim());
  form.append('excerpt_fa', document.getElementById(`editBlogExcerptFa-${id}`).value.trim());
  form.append('content_en', document.getElementById(`editBlogContentEn-${id}`).value.trim());
  form.append('content_fa', document.getElementById(`editBlogContentFa-${id}`).value.trim());
  const author = document.getElementById(`editBlogAuthor-${id}`).value.trim();
  if (author) form.append('author', author);
  form.append('category_id', document.getElementById(`editBlogCategory-${id}`).value);
  form.append('status', document.getElementById(`editBlogStatus-${id}`).value);
  form.append('tag_ids', collectCheckedTagIds('editBlogPost-' + id));
  const featuredImage = document.getElementById(`editBlogFeaturedImage-${id}`).files[0];
  if (featuredImage) form.append('featured_image', featuredImage);
  const ogImage = document.getElementById(`editBlogOgImage-${id}`).files[0];
  if (ogImage) form.append('og_image', ogImage);

  const res = await fetch(`/api/admin/blog/posts/${id}`, {method: 'PUT', body: form});
  if (!res.ok) { err.textContent = 'Could not save changes.'; return; }
  loadBlog(false);
}

async function deleteBlogPost(id) {
  if (!confirm('Delete this post permanently?')) return;
  await fetch(`/api/admin/blog/posts/${id}`, {method: 'DELETE'});
  loadBlog(false);
}

async function createPlan() {
  const devicesRaw = document.getElementById('newPlanDevices').value.trim();
  const payload = {
    name: document.getElementById('newPlanName').value.trim(),
    price_usdt: parseFloat(document.getElementById('newPlanPrice').value),
    data_limit_gb: parseInt(document.getElementById('newPlanData').value),
    duration_days: parseInt(document.getElementById('newPlanDays').value),
    max_devices: devicesRaw ? parseInt(devicesRaw) : null,
  };
  if (!payload.name || isNaN(payload.price_usdt) || !payload.data_limit_gb || !payload.duration_days) {
    showToast('Please fill in every field (price can be 0 for a free plan).', 'error');
    return;
  }
  const res = await fetch('/api/admin/plans', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (res.ok) loadPlans(); else showToast('This plan could not be created — please try again.', 'error');
}

async function savePlan(id) {
  const devicesRaw = document.getElementById(`editDevices-${id}`).value.trim();
  const payload = {
    name: document.getElementById(`editName-${id}`).value.trim(),
    price_usdt: parseFloat(document.getElementById(`editPrice-${id}`).value),
    data_limit_gb: parseInt(document.getElementById(`editData-${id}`).value),
    duration_days: parseInt(document.getElementById(`editDays-${id}`).value),
    max_devices: devicesRaw ? parseInt(devicesRaw) : null,
    is_active: document.getElementById(`editActive-${id}`).checked,
  };
  if (!payload.name || isNaN(payload.price_usdt) || !payload.data_limit_gb || !payload.duration_days) {
    showToast('Please fill in every field (price can be 0 for a free plan).', 'error');
    return;
  }
  const res = await fetch(`/api/admin/plans/${id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (res.ok) { showToast('Plan updated.', 'success'); loadPlans(); }
  else showToast('Could not update this plan — please try again.', 'error');
}

async function togglePlanActive(id, currentlyActive) {
  const res = await fetch(`/api/admin/plans/${id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({is_active: !currentlyActive})
  });
  if (res.ok) loadPlans();
  else showToast('Could not update this plan — please try again.', 'error');
}

async function deletePlan(id) {
  if (!confirm(
    "Delete this plan? If it's never been ordered, it will be permanently removed. "
    + "Otherwise (past orders reference it) it will be deactivated instead."
  )) return;
  const res = await fetch(`/api/admin/plans/${id}`, {method: 'DELETE'});
  if (!res.ok) {
    showToast('Could not delete this plan — please try again.', 'error');
    return;
  }
  const data = await res.json().catch(() => ({}));
  showToast(data.deleted ? 'Plan permanently deleted.' : 'This plan has order history — deactivated instead.', 'success');
  loadPlans();
}

function auditRowHtml(l) {
  return `
    <div class="list-row">
      <div class="lr-main">
        <div class="lr-title">${escapeHtml(actionLabels[l.action] || l.action)}</div>
        <div class="lr-sub">Target: ${escapeHtml(l.target)}${l.detail ? ' — ' + escapeHtml(l.detail) : ''}</div>
      </div>
      <div class="lr-right"><span class="faint" style="font-size:12px">${new Date(l.created_at).toLocaleString('en-US')}</span></div>
    </div>
  `;
}

async function loadAuditLog(reset = true) {
  if (reset) { auditPage = 1; }
  const params = new URLSearchParams({page: auditPage, page_size: ADMIN_PAGE_SIZE});
  const res = await fetch(`/api/admin/audit-log?${params}`);
  if (!res.ok) return;
  const data = await res.json();
  const container = document.getElementById('auditRows');
  container.innerHTML = data.items.map(auditRowHtml).join('') || '<div class="empty-state">No activity logged yet</div>';
  document.getElementById('auditCount').textContent = `${data.total} total`;
  renderPaginationBar('audit', auditPage, data.total);
}

function changeAuditPage(delta) { auditPage += delta; loadAuditLog(false); }
</script>
</body>
</html>
