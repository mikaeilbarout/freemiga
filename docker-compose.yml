services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freemiga
      POSTGRES_USER: freemiga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freemiga"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://freemiga:${POSTGRES_PASSWORD}@db:5432/freemiga
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - banner_uploads:/app/app/static/uploads/banners
      # blog and tickets were missing their own volumes — uploads.py
      # writes them to the container's own filesystem, which is thrown
      # away on every `--force-recreate` (every deploy.sh run). Without
      # a persistent volume here, blog post images and support-ticket
      # attachments silently vanished (their DB rows/paths survived in
      # Postgres, but the actual files didn't) the next time the app
      # container got rebuilt — exactly what banner_uploads already
      # existed to prevent for banners specifically.
      - blog_uploads:/app/app/static/uploads/blog
      - ticket_uploads:/app/app/static/uploads/tickets
    expose:
      - "8001"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  banner_uploads:
  blog_uploads:
  ticket_uploads:
  certbot_www:
  certbot_certs:
